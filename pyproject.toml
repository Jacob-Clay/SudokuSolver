[project]
name = "sudokusolver"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

dependencies = ["pyside6>=6.12.0"]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
strict = ["sudoku/board.py", "sudoku/grid.py", "sudoku/solvers/*"]

[tool.coverage.run]
source = ["sudoku"]
omit = [
  "sudoku/__init__.py",
  "sudoku/gui/__init__.py",
  "sudoku/gui/__main__.py",
  "sudoku/gui/board_widget.py",
  "sudoku/gui/main_window.py",
  "sudoku/solvers/__init__.py",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
]
